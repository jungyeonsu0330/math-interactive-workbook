<body>
<div class="wrap">
 <h1>유리함수 · 곡선과 직선의 위치 관계 및 대칭성</h1>
 <div class="sub">고쟁이 공통수학2 178쪽 · 유형 02 · 0666~0669 &nbsp;|&nbsp; 그래프의 점(노란 원)을 끌어 보세요. 파란 글씨를 누르면(올리면) 그래프가 형광으로 반응해요.</div>
 
 <div class="nav" id="nav"></div>

  <div>
   <div class="card">

    <div class="pq" id="q"></div>
    <div class="choices" id="choices"></div>
    <div class="input-ans-box" id="ansInputBox" style="display:none">

    <span class="chip hk" data-hl="sym" id="themeChip">유형 02 · 유리함수와 대칭성</span>
    <div id="concept"></div>
   </div>
  </div>
 </div>
</div>

<script>
// 유틸리티 정의
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const clamp = (v, l, h) => Math.max(l, Math.min(h, v));
const hk = (key, txt, cls) => `<span class="hk${cls ? " " + cls : ""}" data-hl="${key}">${txt}</span>`;
const kk = t => `<b class="k">${t}</b>`;

const PR = [
  /* 0666 */
  {
    id: "0666", tag: "대표문제",
    K0: { k: -2 }, L: { k: "직선의 기울기 k" },
    bookChoices: ["−5 < k < −1", "−4 ≤ k ≤ −1", "k ≤ −5 또는 −2 ≤ k < 0", "k ≤ −4 또는 −1 ≤ k < 0", "k ≤ −4 또는 k ≥ −1"],
    bookIdx: 4,
    conceptTitle: "유리함수와 직선의 위치 관계 & 접선 판별식",
    conceptHtml: `
      <div class="cp-eq">
        <div class="cp-term t4" data-hl="curve"><b>y = 1/(x+1) − 2</b><small>점근선 x=−1, y=−2</small></div>
        <span class="op">∩</span>
        <div class="cp-term t1" data-hl="line"><b>y = k(x−1) − 6</b><small>정점 (1, −6) 통과</small></div>
        <span class="op">⇒</span>
        <div class="cp-term t3" data-hl="krange"><b>D/4 = (k+4)(k+1) = 0</b><small>접선 k = −4, −1</small></div>
      </div>
      <div class="cp-row"><span class="lab">위치 관계</span><span>곡선과 직선 연립: kx² − 4x − (k+5) = 0</span></div>
      <div class="cp-row"><span class="lab">부호 나누기</span><span class="cp-var t1" data-hl="krange">k ≤ −4 또는 k ≥ −1 (만남)</span><span class="cp-var t2" data-hl="krange">−4 < k < −1 (안 만남)</span></div>
      <div class="cp-row"><span class="lab">왜 필요할까</span><span>유리함수는 점근선과 곡선의 볼록성 때문에 정점을 중심으로 회전할 때 접하는 두 순간이 경계가 된다!</span></div>
      <div class="cp-row"><span class="lab">풀이 순서</span><span class="cp-tag" data-hl="curve">① 점근선 확인</span><span class="cp-tag" data-hl="fixpt">② 정점 (1, −6) 파악</span><span class="cp-tag" data-hl="tan">③ 판별식 D=0 접선</span><span class="cp-tag" data-hl="krange">④ 회전 영역 결정</span></div>
      <div class="cp-row"><span class="lab">출제 단서</span><span class="cp-tag" data-hl="curve">곡선 y = f(x)</span><span class="cp-tag" data-hl="line">직선 y = g(x)</span><span class="cp-tag" data-hl="krange">A ∩ B ≠ ∅</span></div>
    `,
    modes: [
      {
        n: "원래 문제", K: { k: -2 }, hl: ["curve", "line"],
        text: K => `두 집합 <br>${hk("curve", "A = {(x, y) | y = (−2x−1)/(x+1)}", "c1")}, <br>${hk("line", "B = {(x, y) | y = kx − k − 6}", "c2")}에 대하여 ${hk("krange", "A ∩ B ≠ ∅", "g")}일 때, 실수 ${hk("k", "k")}의 값의 범위는?`,
        ans: K => ({ text: "k ≤ −4 또는 k ≥ −1" }),
        sol: K => [
          `유리함수 ${hk("curve", "y = (−2x−1)/(x+1) = 1/(x+1) − 2")} 는 점근선이 x = −1, y = −2 에요.`,
          `직선 ${hk("line", "y = k(x−1) − 6")} 은 실수 k에 관계없이 항상 정점 ${hk("fixpt", "(1, −6)")} 을 지나요.`,
          `두 식을 연립하면 (−2x−1)/(x+1) = kx − k − 6 에서 kx² − 4x − (k+5) = 0 이에요.`,
          `곡선과 직선이 접할 때 판별식 D/4 = (−2)² − k(−k−5) = (k+4)(k+1) = 0 에서 ${hk("tan", "k = −4 또는 k = −1")} 이에요.`,
          `그래프를 회전시켜 보면 k ≤ −4 일 때 3사분면 곡선과 만나고, k ≥ −1 일 때 4사분면 곡선과 만나요.`,
          `따라서 두 그래프가 만나는(A ∩ B ≠ ∅) k의 범위는 <b>k ≤ −4 또는 k ≥ −1</b> 이에요.`
        ],
        altSol: [
          `<b>기하학적 직관 풀이:</b>`,
          `정점 (1, −6)은 점근선 교점 (−1, −2)의 오른쪽 아래에 위치해요.`,
          `• k = −4 일 때 3사분면 곡선과 접함 (더 가파르면 2점 만남 → k ≤ −4)`,
          `• −4 < k < −1 일 때 곡선 사이 빈 틈을 지나 교점 0개!`,
          `• k = −1 일 때 4사분면 곡선과 접함 (반시계로 돌리면 k ≥ −1에서 항상 교점 발생)`,
          `따라서 <b>k ≤ −4 또는 k ≥ −1</b> 임을 빠르게 판정할 수 있습니다.`
        ]
      },
      {
        n: "접할 때의 기울기 k", d: "오직 한 점에서 접할 때의 k값 구하기", K: { k: -4 }, hl: ["tan"],
        choices: ["k = −4 또는 k = −1", "k = −3 또는 k = 0", "k = −5 또는 k = −2", "k = −4만 가능", "k = −1만 가능"],
        choiceIdx: 0,
        text: K => `두 집합 A = {(x, y) | y = (−2x−1)/(x+1)}, B = {(x, y) | y = kx − k − 6}에 대하여 두 도형이 ${hk("tan", "오직 한 점에서 접할 때", "g")}의 실수 k의 값은?`,
        ans: K => ({ text: "k = −4 또는 k = −1" }),
        sol: K => [
          `두 식을 연립하여 정리하면 kx² − 4x − (k+5) = 0 이에요.`,
          `접하므로 판별식 D/4 = 0 이어야 해요.`,
          `D/4 = 4 + k(k+5) = k² + 5k + 4 = (k+4)(k+1) = 0`,
          `따라서 <b>k = −4 또는 k = −1</b> 일 때 두 도형이 접해요.`
        ]
      },
      {
        n: "만나지 않을 조건", d: "교점이 없도록 하는 k의 범위", K: { k: -2.5 }, hl: ["krange"],
        choices: ["−4 < k < −1", "k < −4", "k > −1", "−5 < k < 0", "−3 < k < 1"],
        choiceIdx: 0,
        text: K => `두 집합 A = {(x, y) | y = (−2x−1)/(x+1)}, B = {(x, y) | y = kx − k − 6}에 대하여 ${hk("krange", "A ∩ B = ∅ (교점 없음)", "g")}을 만족하는 k의 범위는?`,
        ans: K => ({ text: "−4 < k < −1" }),
        sol: K => [
          `두 도형이 만날 조건이 k ≤ −4 또는 k ≥ −1 이므로,`,
          `만나지 않을 조건은 그 여집합인 <b>−4 < k < −1</b> 이에요.`
        ]
      }

let cur = 0, mi = 0, K = {}, P = {}, showSol = false, showAlt = false;

const cv = $("#cv"), ctx = cv.getContext("2d");

const def = () => PR[cur], mode = () => def().modes[mi];

function recomputeHL() {
  window.HLK = hoverHL || lockHL || [];
  document.querySelectorAll("[data-hl]").forEach(e => {
    const ks = e.dataset.hl.split(",");
    e.classList.toggle("hkon", window.HLK.length > 0 && ks.some(k => window.HLK.includes(k)));
  });
}

document.addEventListener("mouseover", e => {
  const t = e.target.closest && e.target.closest("[data-hl]");
  if (t) { hoverHL = t.dataset.hl.split(","); recomputeHL(); }
});
document.addEventListener("mouseout", e => {
  const t = e.target.closest && e.target.closest("[data-hl]");
  if (t) { hoverHL = null; recomputeHL(); }
});
document.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest("[data-hl]");
  if (t && !t.classList.contains("tb") && !t.classList.contains("vc")) {
    const ks = t.dataset.hl.split(",");
    lockHL = (lockHL && lockHL.join() === ks.join()) ? null : ks;
    recomputeHL();
  }
});

function setMode(i, Kn) {
  mi = i;
  const m = mode();
  K = Object.assign({}, Kn || m.K);
  showSol = false;
  showAlt = false;
  lockHL = null;
  hoverHL = null;
  render();
}

function renderChoices() {
  const box = $("#choices");
  const inputBox = $("#ansInputBox");
  box.innerHTML = "";

  const d = def(), m = mode();
  if (d.isInput && mi === 0) {
    box.style.display = "none";
    inputBox.style.display = "flex";
    $("#userAns").value = "";
    $("#bSubmitAns").onclick = () => {
      const v = Number($("#userAns").value.trim());
      if (v === d.correctVal) {
        $("#vmsg").innerHTML = `<span style="color:#4ade80;font-weight:800">정답입니다! 36 (풀이 보기로 과정을 확인하세요.)</span>`;
        solved[cur] = 1;
        renderNav();
      } else {
        $("#vmsg").innerHTML = `<span style="color:#fb7185;font-weight:800">다시 계산해 보세요. 대칭점의 성질 a+b=8, ab=14를 이용해요.</span>`;
      }
    };
    return;
  }

  box.style.display = "grid";
  inputBox.style.display = "none";

  const choicesList = m.choices || d.bookChoices;
  const correctIndex = m.choiceIdx !== undefined ? m.choiceIdx : d.bookIdx;

  choicesList.forEach((c, idx) => {
    const b = document.createElement("button");
    b.className = "ch";
    b.innerHTML = "①②③④⑤"[idx] + " " + c;
    b.onclick = () => {
      if (idx === correctIndex) {
        b.classList.add("good");
        solved[cur] = 1;
        renderNav();
        $("#vmsg").innerHTML = `<span style="color:#4ade80;font-weight:800">정답이에요! [풀이 보기]로 상세한 과정을 확인해 보세요.</span>`;
      } else {
        b.classList.add("bad");
        $("#vmsg").innerHTML = `<span style="color:#fb7185">다시 풀어보세요! 유리함수의 대칭성과 점근선을 먼저 파악하세요.</span>`;
      }
    };
    box.appendChild(b);
  });
}

function renderNav() {
  $("#nav").innerHTML = "";
  PR.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "tb" + (i === cur ? " on" : "") + (solved[i] ? " ok" : "");
    b.textContent = (solved[i] ? "✔ " : "") + p.id + (p.tag ? " · " + p.tag.split("·")[0].trim() : "");
    b.onclick = () => { cur = i; setMode(0); };
    $("#nav").appendChild(b);
  });
}

function renderVar() {
  const d = def(), box = $("#vchips");
  box.innerHTML = "";
  d.modes.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "vc" + (i === mi ? " on" : "");
    b.innerHTML = m.n;
    b.title = m.d || "";
    b.onclick = () => setMode(i);
    b.onmouseenter = () => { hoverHL = m.hl; recomputeHL(); };
    b.onmouseleave = () => { hoverHL = null; recomputeHL(); };
    box.appendChild(b);
  });

  const kb = $("#vknobs");
  kb.innerHTML = "";
  if (mode().K) {
    Object.keys(mode().K).forEach(k => {
      const l = document.createElement("label");
      l.className = "cv";
      l.innerHTML = `${d.L && d.L[k] ? d.L[k] : k} <input type="number" step="0.5" data-k="${k}" value="${K[k]}">`;
      kb.appendChild(l);
    });
  }
  $("#vmsg").textContent = mode().d || "조건을 바꾼 응용 문제예요.";
}

function render() {
  const d = def(), m = mode();
  $("#qid").innerHTML = `${d.id} · ${m.n}` + (d.tag ? ` <span class="tag">${d.tag}</span>` : "");
  $("#q").innerHTML = m.text(K);
  $("#solcard").style.display = "none";
  $("#alt").style.display = "none";
  $("#bAlt").textContent = "다른 풀이";
  $("#bSol").textContent = "풀이 보기";

  $("#themeChip").textContent = d.conceptTitle;
  $("#concept").innerHTML = d.conceptHtml;

  renderChoices();
  renderNav();
  renderVar();
  recomputeHL();
  sizeCv();
  renderMath();
}

function renderMath() {
  if (typeof renderMathInElement === "function") {
    try {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    } catch (e) {
      console.warn("KaTeX render error:", e);
    }
  }
}
window.renderMath = renderMath;

$("#bSol").onclick = () => {
  showSol = !showSol;
  $("#solcard").style.display = showSol ? "block" : "none";
  $("#bSol").textContent = showSol ? "풀이 접기" : "풀이 보기";
  if (showSol) {
    const m = mode();
    $("#sol").innerHTML = m.sol(K).map((l, i) => `<div style="margin:6px 0">${"①②③④⑤⑥"[i] || "•"} ${l}</div>`).join("") +
      `<div class="big ok" style="margin-top:10px">정답: ${m.ans(K).text}</div>`;
    renderMath();
  }
};

$("#bAlt").onclick = () => {
  showAlt = !showAlt;
  $("#alt").style.display = showAlt ? "block" : "none";
  $("#bAlt").textContent = showAlt ? "다른 풀이 접기" : "다른 풀이";
  if (showAlt) {
    const m = mode();
    $("#altContent").innerHTML = (m.altSol || ["대칭성을 활용하면 빠르게 풀립니다."]).map(l => `<div style="margin:4px 0">${l}</div>`).join("");

};

$("#bReset").onclick = () => setMode(mi, mode().K);
$("#bVar").onclick = () => {

  setMode(mi, o);
};
$("#bVarOrig").onclick = () => setMode(0);

/* ---------- Canvas 렌더링 ---------- */
function sizeCv() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = Math.max(260, cv.clientWidth || 500);
  chh = Math.max(260, Math.min(Math.round(cw * 0.68), 450));
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(chh * dpr);
  cv.style.height = chh + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", () => { sizeCv(); });
window.addEventListener("orientationchange", () => { setTimeout(sizeCv, 150); });

let V = { x0: -6, x1: 6, y0: -8, y1: 4 };
const X = x => 40 + (x - V.x0) / (V.x1 - V.x0) * (cw - 60);
const Y = y => 20 + (V.y1 - y) / (V.y1 - V.y0) * (chh - 50);
const iX = px => V.x0 + (px - 40) / (cw - 60) * (V.x1 - V.x0);
const iY = py => V.y1 - (py - 20) / (chh - 50) * (V.y1 - V.y0);

function drawAxes() {
  ctx.save();
  ctx.strokeStyle = "rgba(148, 163, 184, 0.15)";
  ctx.lineWidth = 1;
  ctx.fillStyle = "#64748b";
  ctx.font = "11px sans-serif";

  const xStep = (V.x1 - V.x0) > 12 ? 2 : 1;
  for (let x = Math.ceil(V.x0 / xStep) * xStep; x <= V.x1; x += xStep) {
    ctx.beginPath(); ctx.moveTo(X(x), 20); ctx.lineTo(X(x), chh - 30); ctx.stroke();
    if (x !== 0) ctx.fillText(String(x), X(x) - 4, Y(0) + 14);
  }
  const yStep = (V.y1 - V.y0) > 12 ? 2 : 1;
  for (let y = Math.ceil(V.y0 / yStep) * yStep; y <= V.y1; y += yStep) {
    ctx.beginPath(); ctx.moveTo(40, Y(y)); ctx.lineTo(cw - 20, Y(y)); ctx.stroke();
    if (y !== 0) ctx.fillText(String(y), 18, Y(y) + 4);
  }

  ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1.8;
  if (V.y0 <= 0 && V.y1 >= 0) {
    ctx.beginPath(); ctx.moveTo(40, Y(0)); ctx.lineTo(cw - 20, Y(0)); ctx.stroke();
    ctx.fillText("x", cw - 30, Y(0) - 6);
  }
  if (V.x0 <= 0 && V.x1 >= 0) {
    ctx.beginPath(); ctx.moveTo(X(0), 20); ctx.lineTo(X(0), chh - 30); ctx.stroke();
    ctx.fillText("y", X(0) + 6, 32);
  }
  ctx.fillText("O", X(0) - 12, Y(0) + 14);
  ctx.restore();
}

function drawHandle(x, y, radius = 7, label = "") {
  ctx.save();
  const pul = 0.5 + 0.5 * Math.sin(performance.now() / 200);
  ctx.fillStyle = "#facc15";
  ctx.shadowColor = "#facc15";
  ctx.shadowBlur = 10 + 8 * pul;
  ctx.beginPath();
  ctx.arc(X(x), Y(y), radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  if (label) {
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(label, X(x) + 10, Y(y) - 8);
  }
}

function drawPill(text, x, y, col) {
  ctx.save();
  ctx.font = "800 12.5px sans-serif";
  const w = ctx.measureText(text).width + 14;
  const h = 22;
  const px = clamp(x - w / 2, 4, cw - w - 4);
  const py = clamp(y - h / 2, 4, chh - h - 4);
  ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(px, py, w, h, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col;
  ctx.fillText(text, px + 7, py + 15);
  ctx.restore();
}

function draw() {
  if (cur === 0) V = { x0: -6, x1: 6, y0: -8, y1: 4 };
  else if (cur === 1) V = { x0: -1, x1: 7, y0: -1, y1: 7 };
  else if (cur === 2) V = { x0: -1, x1: 10, y0: -1, y1: 10 };
  else if (cur === 3) V = { x0: -4, x1: 5, y0: -2, y1: 5 };

  ctx.clearRect(0, 0, cw, chh);
  ctx.fillStyle = "#0b1226";
  ctx.fillRect(0, 0, cw, chh);

  drawAxes();

  if (cur === 0) {
    const k = K.k !== undefined ? K.k : -2;
    // 점근선
    ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = "rgba(148, 163, 184, 0.4)";
    ctx.beginPath(); ctx.moveTo(X(-1), 20); ctx.lineTo(X(-1), chh - 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(40, Y(-2)); ctx.lineTo(cw - 20, Y(-2)); ctx.stroke();
    ctx.restore();

    // 곡선
    ctx.save(); ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = 40; px <= X(-1.08); px += 2) {
      const x = iX(px); const y = 1 / (x + 1) - 2;
      px === 40 ? ctx.moveTo(px, Y(y)) : ctx.lineTo(px, Y(y));
    }
    ctx.stroke();
    ctx.beginPath();
    let first = true;
    for (let px = X(-0.92); px <= cw - 20; px += 2) {
      const x = iX(px); const y = 1 / (x + 1) - 2;
      first ? (ctx.moveTo(px, Y(y)), first = false) : ctx.lineTo(px, Y(y));
    }
    ctx.stroke(); ctx.restore();

    // 직선
    ctx.save(); ctx.strokeStyle = "#f43f5e"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(X(V.x0), Y(k * (V.x0 - 1) - 6));
    ctx.lineTo(X(V.x1), Y(k * (V.x1 - 1) - 6));
    ctx.stroke(); ctx.restore();

    // 정점
    ctx.fillStyle = "#fb923c";
    ctx.beginPath(); ctx.arc(X(1), Y(-6), 6, 0, Math.PI * 2); ctx.fill();

    const hx = 2.5, hy = k * (hx - 1) - 6;
    drawHandle(hx, hy, 7, `k = ${k.toFixed(1)}`);
    drawPill("곡선 y = (−2x−1)/(x+1)", X(2), Y(-1.2), "#38bdf8");
    drawPill(`직선 y = ${k.toFixed(1)}(x−1)−6`, X(hx - 0.5), Y(hy + 1.2), "#f43f5e");
  } else if (cur === 1) {
    ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(250, 204, 21, 0.5)";
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(6), Y(6)); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = X(0.4); px <= cw - 20; px += 2) {
      const x = iX(px); const y = 4 / x;
      px === X(0.4) ? ctx.moveTo(px, Y(y)) : ctx.lineTo(px, Y(y));
    }
    ctx.stroke(); ctx.restore();

    const a = K.a || 1.035; const b = 4 / a;
    ctx.save(); ctx.strokeStyle = "#f43f5e"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(a - 0.6), Y(b + 0.6)); ctx.lineTo(X(b + 0.6), Y(a - 0.6)); ctx.stroke(); ctx.restore();

    drawHandle(a, b, 7, "A");
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.arc(X(b), Y(a), 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("B", X(b) + 8, Y(a) - 6);

    const AB = Math.hypot(b - a, a - b);
    drawPill("y = 4/x", X(4.5), Y(1.5), "#38bdf8");
    drawPill("대칭축 y = x", X(5), Y(5), "#facc15");
    drawPill(`선분 AB = ${AB.toFixed(1)}`, X((a + b) / 2), Y((a + b) / 2 + 0.8), "#f43f5e");
  } else if (cur === 2) {
    ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = "rgba(148, 163, 184, 0.4)";
    ctx.beginPath(); ctx.moveTo(X(2), 20); ctx.lineTo(X(2), chh - 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(40, Y(2)); ctx.lineTo(cw - 20, Y(2)); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(250, 204, 21, 0.4)";
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(9), Y(9)); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.strokeStyle = "#f43f5e"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(8), Y(0)); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = X(2.2); px <= cw - 20; px += 2) {
      const x = iX(px); const y = 2 + 2 / (x - 2);
      px === X(2.2) ? ctx.moveTo(px, Y(y)) : ctx.lineTo(px, Y(y));
    }
    ctx.stroke(); ctx.restore();

    const xP = 4 - Math.sqrt(2), yP = 4 + Math.sqrt(2);
    const xQ = 4 + Math.sqrt(2), yQ = 4 - Math.sqrt(2);
    drawHandle(xP, yP, 7, "P");
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.arc(X(xQ), Y(yQ), 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("Q", X(xQ) + 8, Y(yQ) - 6);

    drawPill("x + y = 8", X(7), Y(1.5), "#f43f5e");
    drawPill("xy − 2x − 2y = −2", X(7), Y(3), "#38bdf8");
    drawPill("대칭축 y = x", X(7), Y(7), "#facc15");
  } else if (cur === 3) {
    ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(250, 204, 21, 0.4)";
    ctx.beginPath(); ctx.moveTo(X(-3), Y(-3)); ctx.lineTo(X(4), Y(4)); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = X(0.3); px <= cw - 20; px += 2) {
      const x = iX(px); const y = 2 / x;
      px === X(0.3) ? ctx.moveTo(px, Y(y)) : ctx.lineTo(px, Y(y));
    }
    ctx.stroke(); ctx.restore();

    const al = K.alpha || 2.732; const be = 2 / al;

    ctx.save();
    ctx.fillStyle = "rgba(167, 139, 250, 0.25)";
    ctx.strokeStyle = "#a78bfa";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(X(-2), Y(2)); ctx.lineTo(X(al), Y(be)); ctx.lineTo(X(be), Y(al)); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();

    ctx.fillStyle = "#f43f5e";
    ctx.beginPath(); ctx.arc(X(-2), Y(2), 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("A(−2, 2)", X(-2) - 48, Y(2) - 8);

    drawHandle(al, be, 7, "B(α, β)");
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.arc(X(be), Y(al), 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("C(β, α)", X(be) - 42, Y(al) - 6);

    const triArea = 0.5 * (al * al - be * be);
    drawPill("y = 2/x", X(4), Y(0.8), "#38bdf8");
    drawPill("y = x 대칭", X(3.8), Y(3.8), "#facc15");
    drawPill(`△ABC 넓이 = ${triArea.toFixed(2)}`, X(0.5), Y(1.8), "#a78bfa");
  }

  requestAnimationFrame(draw);
}

/* 드래그 이벤트 */
function getCanvasPos(e) {
  const rect = cv.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: cx - rect.left, y: cy - rect.top };
}
cv.addEventListener("mousedown", () => drag = true);
cv.addEventListener("touchstart", (e) => {
  drag = true;
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("mouseup", () => drag = false);
window.addEventListener("touchend", () => drag = false);
window.addEventListener("touchcancel", () => drag = false);
window.addEventListener("mousemove", onMove);
window.addEventListener("touchmove", onMove, { passive: false });

function onMove(e) {
  if (!drag) return;
  if (e.cancelable) e.preventDefault();
  const p = getCanvasPos(e);
  const mx = iX(p.x), my = iY(p.y);

  if (cur === 0) {
    const dx = mx - 1, dy = my - (-6);
    if (Math.abs(dx) > 0.1) {
      K.k = clamp(dy / dx, -8, 5);
      renderVar();
    }
  } else if (cur === 1) {
    K.a = clamp(mx, 0.5, 2.0);
    renderVar();
  } else if (cur === 3) {
    K.alpha = clamp(mx, 1.45, 3.8);
    renderVar();
  }
}

// 초기화 실행
setMode(0);
draw();
setTimeout(renderMath, 150);
window.addEventListener("DOMContentLoaded", () => setTimeout(renderMath, 200));
</script>
</body>
