<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>미적분Ⅰ 124쪽 · 곡선과 x축 사이의 넓이</title>
<style>
:root{--bg:#0f172a;--panel:#111a30;--line:#26365a;--tx:#e8edf6;--mut:#8ea0bb;--c1:#22d3ee;--c2:#fb923c;--c3:#4ade80;--pnk:#f472b6;--vio:#a78bfa;--yel:#facc15}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 36px}
h1{margin:0 0 4px;font-size:21px;color:var(--yel)}.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.tb{background:#1a2440;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13.5px;font-weight:800;cursor:pointer}
.tb.on{background:var(--pnk);color:#2a0b1a;border-color:var(--pnk)}.tb.ok{border-color:var(--c3)}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:880px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:2px solid var(--pnk);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.card.y{border-color:var(--yel)}.card.g{border-color:var(--c3)}.card.p{border-color:var(--pnk)}
.lb{font-size:12px;font-weight:800;margin-bottom:6px;color:var(--mut)}
canvas{width:100%;display:block;background:#0b1226;border-radius:12px;touch-action:none}
.hint{color:var(--mut);font-size:12.5px;margin-top:8px;line-height:1.5}
.btn{background:#18244a;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13.5px;cursor:pointer;margin:4px 6px 0 0}
.btn.p{background:var(--c3);color:#06301a;font-weight:800;border-color:var(--c3)}
.pq{font-size:17.5px;line-height:1.95}.tag{display:inline-block;background:#1b3a2d;color:#7ee0a6;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:800;margin-left:6px}
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.ch{background:#18244a;color:var(--tx);border:1.5px solid var(--line);border-radius:10px;padding:10px 2px;font-size:15px;font-weight:700;cursor:pointer;transition:.12s}
.ch:hover{border-color:#6b82b8;background:#1d2b57}.ch.good{background:#12372a;border-color:#4ade80;color:#4ade80}.ch.bad{background:#3a1822;border-color:#fb7185;color:#fb7185;animation:shk .25s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hk{cursor:pointer;border-bottom:2px dotted #8aa0c8;transition:.12s;border-radius:3px}
.hk:hover,.hk.hkon{background:rgba(250,204,21,.22);border-bottom-color:#facc15}.hk.g{color:#4ade80;font-weight:800;border-bottom-color:#4ade80}.k{color:#facc15;font-weight:800}
.vc{background:#1a2440;color:var(--tx);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.vc:hover{border-color:#f472b6}.vc.on{background:#f472b6;border-color:#f472b6;color:#2a0b1a}
.cv{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}.cv input{background:#060a16;color:#e2e8f0;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:14px;width:76px}
.chip{display:inline-block;background:var(--yel);color:#1b1500;border-radius:14px;padding:2px 12px;font-weight:800;font-size:13px}
.cp-eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 8px;background:#0c1530;border-radius:14px;margin-top:10px}
.cp-eq .op{font-size:26px;font-weight:900;color:#cbd5e1}
.cp-term{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 12px;border:2px solid currentColor;border-radius:14px;cursor:pointer;transition:.12s;min-width:84px}
.cp-term b{font-size:24px;line-height:1}.cp-term small{font-size:12px;color:#aebbd4;font-weight:600}.cp-term svg{display:block}
.cp-term:hover,.cp-term.hkon{background:rgba(255,255,255,.1);transform:translateY(-2px);box-shadow:0 0 16px currentColor}
.t1{color:#22d3ee}.t2{color:#fb923c}.t3{color:#4ade80}
.cp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14.5px;color:#d5deee}.cp-row .lab{flex:none;font-size:11.5px;font-weight:800;color:#8ea0bb;min-width:62px}
.cp-var{display:inline-flex;gap:5px;border:1.5px solid currentColor;border-radius:999px;padding:1px 10px;font-weight:800;cursor:pointer;transition:.12s}
.cp-var:hover,.cp-var.hkon{background:rgba(255,255,255,.12);box-shadow:0 0 10px currentColor}
.cp-tag{display:inline-block;border:1.5px dashed #6b7fa8;border-radius:8px;padding:1px 9px;font-size:13px;cursor:pointer;color:#c3cde2;transition:.12s}
.cp-tag:hover,.cp-tag.hkon{background:rgba(250,204,21,.18);border-color:#facc15;color:#fff}
.f{font-size:15px;line-height:1.75}.ok{color:var(--c3);font-weight:800}.big{font-size:20px;font-weight:900}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 9px;margin:4px 0;background:#0c1530;border-radius:9px;font-size:14px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px;font-size:.92em}.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}.fr>span:last-child{padding:0 3px}.ig{display:inline-flex;align-items:center;vertical-align:middle;margin:0 2px}.ign{font-size:1.9em;line-height:1;font-weight:300;transform:scaleY(1.15)}.lim{display:inline-flex;flex-direction:column;justify-content:space-between;font-size:.65em;line-height:1.1;margin-left:1px;vertical-align:middle;align-self:stretch}.lim sup,.lim sub{vertical-align:baseline;font-size:1em}.br{font-size:1.4em;vertical-align:middle}.altm{background:#0c1530;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15px;line-height:1.7}.altt{color:var(--yel);font-weight:800;font-size:13px}</style></head><body><div class="wrap">
<h1>미적분Ⅰ · 곡선과 x축 사이의 넓이</h1>
<div class="sub">RPM 미적분Ⅰ 124쪽 · 유형 01 · 0815~0821 &nbsp;|&nbsp; 그래프의 점(노란 원)을 끌어 보세요. 파란 글씨를 누르면(올리면) 그래프가 형광으로 반응해요.</div>
<div class="nav" id="nav"></div>
<div class="grid">
 <div class="card"><canvas id="cv"></canvas>
  <div class="hint" id="chint"></div>
  <div><button class="btn" id="bReset">↺ 처음 모양</button><button class="btn" id="bSol">풀이 보기</button><button class="btn" id="bAlt">다른 풀이</button></div>
  <div class="card g" id="solcard" style="margin:12px 0 0;display:none"><div class="lb" style="color:var(--c3)">정답과 풀이</div><div class="f" id="sol"></div></div><div class="card y" id="alt" style="margin:12px 0 0;display:none"></div></div>
 <div>
  <div class="card"><div class="lb" style="color:var(--pnk)" id="qid"></div><div class="pq" id="q"></div><div class="choices" id="choices"></div></div>
  <div class="card p" id="varcard"><div class="lb" style="color:var(--pnk)">응용 · 변형 문제</div>
   <div id="vchips" style="display:flex;flex-wrap:wrap;gap:6px"></div><div id="vknobs" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
   <div style="margin-top:8px"><button class="btn p" id="bVar">변형 문제 만들기</button><button class="btn" id="bVarOrig">↺ 원래 문제로</button></div><div class="hint" id="vmsg"></div></div>
  <div class="card y"><div class="lb" style="color:var(--yel)">핵심 개념 · 풀이 도구</div><span class="chip hk" data-hl="S">유형 01 · 곡선과 x축 사이의 넓이</span><div id="concept"></div></div>
 </div></div></div>
<script>document.write('<script src="calc124.js?'+Date.now()+'"><\/script><script src="calc124_engine.js?'+Date.now()+'"><\/script>')</script>
</body></html>
