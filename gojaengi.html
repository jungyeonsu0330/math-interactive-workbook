.grid{

.card{

function getProblem(qid) {
  if (PR_MAP[qid]) return PR_MAP[qid];

  const raw = ALL_PROBS[qid];
  if (!raw) {
    return {
      id: qid,
      page: currentPage,
      tag: "연습 문항",
      bookChoices: ["1", "2", "3", "4", "5"],
      bookIdx: 0,
      modes: [{
        n: "원래 문제", K: {},
        text: K => `[고쟁이 공통수학2 ${currentPage}쪽 ${qid}번]<br>문제를 불러오는 중입니다.`,
        ans: K => ({ text: "①" }),
        sol: K => ["풀이 과정입니다."],
        altSol: ["다른 풀이입니다."]
      }]
    };
  }

  const isInput = !raw.isChoice;
  const correctVal = isInput ? raw.ansText : "";

  return {
    id: qid,
    page: raw.page,
    tag: raw.step,
    isInput: isInput,
    correctVal: correctVal,
    bookChoices: raw.choices && raw.choices.length > 0 ? raw.choices : [],
    bookIdx: raw.ansIdx >= 0 ? raw.ansIdx : 0,
    conceptTitle: `${raw.unit} · ${raw.step}`,
    conceptHtml: `
      <div class="cp-eq">
        <div class="cp-term t1"><b>함수 조건</b><small>수식 분석</small></div>
        <span class="op">⇄</span>
        <div class="cp-term t3"><b>그래프 개형</b><small>대칭성과 교점</small></div>
      </div>
      <div class="cp-row"><span class="lab">핵심 전략</span><span>정의역·치역 조건과 대칭축, 점근선 교점을 고려하여 해결</span></div>
    `,
    modes: [
      {
        n: "원래 문제",
        K: {},
        text: K => `[고쟁이 공통수학2 ${raw.page}쪽 ${raw.id}번]<br><b>단원:</b> ${raw.unit} (${raw.step})<br><br>${raw.qText}`,
        ans: K => ({ text: raw.ansText }),
        sol: K => [
          `본 문항은 고쟁이 공통수학2 ${raw.page}쪽의 ${raw.id}번 문항입니다.`,
          `조건식을 분석하여 함수의 핵심 성질(점근선, 축, 주기, 대칭성)을 파악합니다.`,
          `조건을 만족하는 정답을 도출합니다.`
        ],
        altSol: [`그래프의 대칭성과 교점 성질을 파악하면 직관적으로 빠르게 접근할 수 있습니다.`]
      }
    ]
  };
}

let currentUnit = "all";
let currentPage = 178;
let currentQid = "0666";
let curModeIdx = 0;
let showSol = false;
let showAlt = false;
let solved = {};
let lockHL = null, hoverHL = null, drag = null;
let K = {};

let cw = 600, chh = 420;
let V = { x0: -6, x1: 6, y0: -8, y1: 4 };
let cv, ctx;

function curProb() { return getProblem(currentQid); }
function curMode() { return curProb().modes[curModeIdx] || curProb().modes[0]; }

function recomputeHL() {
  window.HLK = hoverHL || lockHL || [];
  document.querySelectorAll("[data-hl]").forEach(e => {
    const ks = e.dataset.hl.split(",");
    e.classList.toggle("hkon", window.HLK.length > 0 && ks.some(k => window.HLK.includes(k)));
  });
}

function renderPageTrack() {
  const bar = $("#pageList");
  bar.innerHTML = "";

  const list = GOJAENGI_PAGES.filter(p => {
    if (currentUnit === "unit1") return p.page <= 164;
    if (currentUnit === "unit2") return p.page >= 165;
    return true;
  });

  list.forEach(p => {
    const btn = document.createElement("button");
    const isCur = p.page === currentPage;
    const isAllOk = p.qids.every(q => solved[q]);

    btn.className = `pg-btn ${isCur ? "active" : ""}`;
    btn.innerHTML = `${p.page}쪽 <small>${p.qids.length}문항</small>`;
    btn.onclick = () => selectPage(p.page);
    bar.appendChild(btn);

    if (isCur) {
      setTimeout(() => btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" }), 50);
    }
  });
}

function renderQidNav() {
  const bar = $("#qidList");
  bar.innerHTML = "";

  const pageObj = GOJAENGI_PAGES.find(p => p.page === currentPage);
  if (!pageObj) return;

  pageObj.qids.forEach(qid => {
    const btn = document.createElement("button");
    const isCur = qid === currentQid;
    const isOk = solved[qid];

    btn.className = `tb ${isCur ? "on" : ""} ${isOk ? "ok" : ""}`;
    btn.textContent = (isOk ? "✔ " : "") + qid;
    btn.onclick = () => selectProblem(qid);
    bar.appendChild(btn);
  });
}

function selectPage(pg) {
  currentPage = pg;
  const pageObj = GOJAENGI_PAGES.find(p => p.page === pg);
  if (pageObj && pageObj.qids.length > 0) {
    currentQid = pageObj.qids[0];
  }
  curModeIdx = 0;
  showSol = false; showAlt = false;
  K = Object.assign({}, curMode().K);
  renderAll();
}

function selectProblem(qid) {
  currentQid = qid;
  const p = getProblem(qid);
  if (p && p.page !== currentPage) {
    currentPage = p.page;
  }
  curModeIdx = 0;
  showSol = false; showAlt = false;
  K = Object.assign({}, curMode().K);
  renderAll();
}

function renderProblemCard() {
  const p = curProb();
  const m = curMode();

  $("#pageBadge").textContent = `${currentPage}쪽`;
  $("#qid").innerHTML = `${p.id} · ${m.n}` + (p.tag ? ` <span class="tag">${p.tag}</span>` : "");
  $("#q").innerHTML = m.text(K);
  $("#solcard").style.display = "none";
  $("#alt").style.display = "none";
  $("#bSol").textContent = "풀이 보기";
  $("#bAlt").textContent = "다른 풀이";

  // 선택지
  const box = $("#choices");
  const inBox = $("#ansInputBox");
  box.innerHTML = "";

  if (p.isInput && curModeIdx === 0) {
    box.style.display = "none";
    inBox.style.display = "flex";
    $("#userAns").value = "";
    $("#bSubmitAns").onclick = () => {
      const userRaw = $("#userAns").value.trim().replace(/\s+/g, "");
      const targetAns = String(p.correctVal || "").trim().replace(/\s+/g, "");
      if (userRaw && (userRaw === targetAns || Number(userRaw) === Number(targetAns))) {
        $("#vmsg").innerHTML = `<span style="color:#4ade80;font-weight:800">정답입니다! (${p.correctVal}) [풀이 보기]로 과정을 확인하세요.</span>`;
        solved[currentQid] = true;
        renderQidNav();
      } else {
        $("#vmsg").innerHTML = `<span style="color:#fb7185;font-weight:800">다시 계산해 보세요. 대칭성과 함수 식의 성질을 이용해요.</span>`;
      }
    };
  } else {
    box.style.display = "grid";
    inBox.style.display = "none";

    const chList = m.choices || p.bookChoices;
    const okIdx = m.choiceIdx !== undefined ? m.choiceIdx : p.bookIdx;

    chList.forEach((c, idx) => {
      const b = document.createElement("button");
      b.className = "ch";
      b.innerHTML = "①②③④⑤"[idx] + " " + c;
      b.onclick = () => {
        if (idx === okIdx) {
          b.classList.add("good");
          solved[currentQid] = true;
          renderQidNav();
          $("#vmsg").innerHTML = `<span style="color:#4ade80;font-weight:800">정답이에요! [풀이 보기]로 상세 과정을 확인해 보세요.</span>`;
        } else {
          b.classList.add("bad");
          $("#vmsg").innerHTML = `<span style="color:#fb7185">다시 풀어보세요! 대칭성과 그래프 개형을 먼저 파악하세요.</span>`;
        }
      };
      box.appendChild(b);
    });
  }

  // 응용 변형 칩
  const vbox = $("#vchips");
  vbox.innerHTML = "";
  p.modes.forEach((mod, idx) => {
    const b = document.createElement("button");
    b.className = "vc" + (idx === curModeIdx ? " on" : "");
    b.innerHTML = mod.n;
    b.onclick = () => {
      curModeIdx = idx;
      K = Object.assign({}, curMode().K);
      renderAll();
    };
    vbox.appendChild(b);
  });

  // 파라미터 조절 입력기
  const kbox = $("#vknobs");
  kbox.innerHTML = "";
  if (curMode().K) {
    Object.keys(curMode().K).forEach(key => {
      const l = document.createElement("label");
      l.className = "cv";
      l.innerHTML = `${p.L && p.L[key] ? p.L[key] : key} <input type="number" step="0.5" data-k="${key}" value="${K[key]}">`;
      kbox.appendChild(l);
    });
  }
  $("#vmsg").textContent = m.d || "조건을 바꾼 응용 문제예요.";

  // 개념 카드
  $("#themeChip").textContent = p.conceptTitle;
  $("#concept").innerHTML = p.conceptHtml;

  // 힌트 텍스트
  if (currentQid === "0666") {
    $("#chint").innerHTML = "노란 점을 위아래로 끌어 <b>직선의 기울기 k</b>를 조절해 보세요. 접선(k=−4, −1)과 교점 개수를 실시간 관찰할 수 있습니다.";
  } else if (currentQid === "0667") {
    $("#chint").innerHTML = "곡선 위의 <b>노란 점 A</b>를 드래그해 보세요. y = x 대칭점 B와 선분 AB의 길이가 실시간으로 계산됩니다.";
  } else if (currentQid === "0668") {
    $("#chint").innerHTML = "<b>직선 x + y = 8</b>과 유리함수의 대칭 교점 P, Q의 좌표를 인터랙티브하게 확인해 보세요.";
  } else if (currentQid === "0669") {
    $("#chint").innerHTML = "<b>노란 점 B</b>를 드래그하면 삼각형 ABC 영역과 넓이 2√3, α² + β² = 8이 실시간 계산됩니다.";
  } else {
    $("#chint").innerHTML = `고쟁이 ${currentPage}쪽 [${p.id}번] 기하 시각화 시뮬레이션입니다.`;
  }

  renderMath();
}

function renderMath() {
  if (typeof renderMathInElement === "function") {
    try {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    } catch (e) {
      console.warn("KaTeX render error:", e);
    }
  }
}
window.renderMath = renderMath;

function renderAll() {
  renderPageTrack();
  renderQidNav();
  renderProblemCard();
  recomputeHL();
  sizeCv();
  renderMath();
}

$("#bAlt").onclick = () => {

    renderMath();

};

$("#bVarOrig").onclick = () => {
  curModeIdx = 0;

// 단원 필터 탭
$$(".unit-btn").forEach(btn => {

    $$(".unit-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

// 하이라이트 이벤트
document.addEventListener("mouseover", e => {
  const t = e.target.closest && e.target.closest("[data-hl]");
  if (t) { hoverHL = t.dataset.hl.split(","); recomputeHL(); }
});
document.addEventListener("mouseout", e => {
  const t = e.target.closest && e.target.closest("[data-hl]");
  if (t) { hoverHL = null; recomputeHL(); }
});
document.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest("[data-hl]");
  if (t && !t.classList.contains("tb") && !t.classList.contains("vc")) {
    const ks = t.dataset.hl.split(",");
    lockHL = (lockHL && lockHL.join() === ks.join()) ? null : ks;
    recomputeHL();
  }
});

// ==========================================
// 4. 캔버스 렌더링 & 드래그 엔진
// ==========================================
function sizeCv() {
  if (!cv) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2); // 고해상도 최적화
  cw = Math.max(260, cv.clientWidth || 500);
  // 모바일/태블릿 화면 비율에 맞춘 최적 높이 계산 (폭 대비 68% 비율, 260px~450px 범위)
  chh = Math.max(260, Math.min(Math.round(cw * 0.68), 450));
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(chh * dpr);
  cv.style.height = chh + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", () => { sizeCv(); });
window.addEventListener("orientationchange", () => { setTimeout(sizeCv, 150); });

const X = x => 40 + (x - V.x0) / (V.x1 - V.x0) * (cw - 60);
const Y = y => 20 + (V.y1 - y) / (V.y1 - V.y0) * (chh - 50);
const iX = px => V.x0 + (px - 40) / (cw - 60) * (V.x1 - V.x0);
const iY = py => V.y1 - (py - 20) / (chh - 50) * (V.y1 - V.y0);

function drawAxes() {
  ctx.save();
  ctx.strokeStyle = "rgba(148, 163, 184, 0.15)";
  ctx.lineWidth = 1;
  ctx.fillStyle = "#64748b";
  ctx.font = "11px sans-serif";

  const xStep = (V.x1 - V.x0) > 12 ? 2 : 1;
  for (let x = Math.ceil(V.x0 / xStep) * xStep; x <= V.x1; x += xStep) {
    ctx.beginPath(); ctx.moveTo(X(x), 20); ctx.lineTo(X(x), chh - 30); ctx.stroke();
    if (x !== 0) ctx.fillText(String(x), X(x) - 4, Y(0) + 14);
  }
  const yStep = (V.y1 - V.y0) > 12 ? 2 : 1;
  for (let y = Math.ceil(V.y0 / yStep) * yStep; y <= V.y1; y += yStep) {
    ctx.beginPath(); ctx.moveTo(40, Y(y)); ctx.lineTo(cw - 20, Y(y)); ctx.stroke();
    if (y !== 0) ctx.fillText(String(y), 18, Y(y) + 4);
  }

  ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1.8;
  if (V.y0 <= 0 && V.y1 >= 0) {
    ctx.beginPath(); ctx.moveTo(40, Y(0)); ctx.lineTo(cw - 20, Y(0)); ctx.stroke();
    ctx.fillText("x", cw - 30, Y(0) - 6);
  }
  if (V.x0 <= 0 && V.x1 >= 0) {
    ctx.beginPath(); ctx.moveTo(X(0), 20); ctx.lineTo(X(0), chh - 30); ctx.stroke();
    ctx.fillText("y", X(0) + 6, 32);
  }
  ctx.fillText("O", X(0) - 12, Y(0) + 14);
  ctx.restore();
}

function drawHandle(x, y, radius = 7, label = "") {
  ctx.save();
  const pul = 0.5 + 0.5 * Math.sin(performance.now() / 200);
  ctx.fillStyle = "#facc15";
  ctx.shadowColor = "#facc15";
  ctx.shadowBlur = 10 + 8 * pul;
  ctx.beginPath();
  ctx.arc(X(x), Y(y), radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  if (label) {
    ctx.fillStyle = "#facc15";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(label, X(x) + 10, Y(y) - 8);
  }
}

function drawPill(text, x, y, col) {
  ctx.save();
  ctx.font = "800 12.5px sans-serif";
  const w = ctx.measureText(text).width + 14;
  const h = 22;
  const px = clamp(x - w / 2, 4, cw - w - 4);
  const py = clamp(y - h / 2, 4, chh - h - 4);
  ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(px, py, w, h, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col;
  ctx.fillText(text, px + 7, py + 15);
  ctx.restore();
}

function draw() {
  if (currentQid === "0666") V = { x0: -6, x1: 6, y0: -8, y1: 4 };
  else if (currentQid === "0667") V = { x0: -1, x1: 7, y0: -1, y1: 7 };
  else if (currentQid === "0668") V = { x0: -1, x1: 10, y0: -1, y1: 10 };
  else if (currentQid === "0669") V = { x0: -4, x1: 5, y0: -2, y1: 5 };
  else V = { x0: -5, x1: 5, y0: -5, y1: 5 };

  ctx.clearRect(0, 0, cw, chh);
  ctx.fillStyle = "#0b1226";
  ctx.fillRect(0, 0, cw, chh);

  drawAxes();

  if (currentQid === "0666") {
    const k = K.k !== undefined ? K.k : -2;
    // 점근선
    ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = "rgba(148, 163, 184, 0.4)";
    ctx.beginPath(); ctx.moveTo(X(-1), 20); ctx.lineTo(X(-1), chh - 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(40, Y(-2)); ctx.lineTo(cw - 20, Y(-2)); ctx.stroke();
    ctx.restore();

    // 곡선
    ctx.save(); ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = 40; px <= X(-1.08); px += 2) {
      const x = iX(px); const y = 1 / (x + 1) - 2;
      px === 40 ? ctx.moveTo(px, Y(y)) : ctx.lineTo(px, Y(y));
    }
    ctx.stroke();
    ctx.beginPath();
    let first = true;
    for (let px = X(-0.92); px <= cw - 20; px += 2) {
      const x = iX(px); const y = 1 / (x + 1) - 2;
      first ? (ctx.moveTo(px, Y(y)), first = false) : ctx.lineTo(px, Y(y));
    }
    ctx.stroke(); ctx.restore();

    // 직선
    ctx.save(); ctx.strokeStyle = "#f43f5e"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(X(V.x0), Y(k * (V.x0 - 1) - 6));
    ctx.lineTo(X(V.x1), Y(k * (V.x1 - 1) - 6));
    ctx.stroke(); ctx.restore();

    // 정점
    ctx.fillStyle = "#fb923c";
    ctx.beginPath(); ctx.arc(X(1), Y(-6), 6, 0, Math.PI * 2); ctx.fill();

    const hx = 2.5, hy = k * (hx - 1) - 6;
    drawHandle(hx, hy, 7, `k = ${k.toFixed(1)}`);
    drawPill("곡선 y = (−2x−1)/(x+1)", X(2), Y(-1.2), "#38bdf8");
    drawPill(`직선 y = ${k.toFixed(1)}(x−1)−6`, X(hx - 0.5), Y(hy + 1.2), "#f43f5e");
  } else if (currentQid === "0667") {
    ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(250, 204, 21, 0.5)";
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(6), Y(6)); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = X(0.4); px <= cw - 20; px += 2) {
      const x = iX(px); const y = 4 / x;
      px === X(0.4) ? ctx.moveTo(px, Y(y)) : ctx.lineTo(px, Y(y));
    }
    ctx.stroke(); ctx.restore();

    const a = K.a || 1.035; const b = 4 / a;
    ctx.save(); ctx.strokeStyle = "#f43f5e"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(a - 0.6), Y(b + 0.6)); ctx.lineTo(X(b + 0.6), Y(a - 0.6)); ctx.stroke(); ctx.restore();

    drawHandle(a, b, 7, "A");
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.arc(X(b), Y(a), 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("B", X(b) + 8, Y(a) - 6);

    const AB = Math.hypot(b - a, a - b);
    drawPill("y = 4/x", X(4.5), Y(1.5), "#38bdf8");
    drawPill("대칭축 y = x", X(5), Y(5), "#facc15");
    drawPill(`선분 AB = ${AB.toFixed(1)}`, X((a + b) / 2), Y((a + b) / 2 + 0.8), "#f43f5e");
  } else if (currentQid === "0668") {
    ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = "rgba(148, 163, 184, 0.4)";
    ctx.beginPath(); ctx.moveTo(X(2), 20); ctx.lineTo(X(2), chh - 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(40, Y(2)); ctx.lineTo(cw - 20, Y(2)); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(250, 204, 21, 0.4)";
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(9), Y(9)); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.strokeStyle = "#f43f5e"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(8), Y(0)); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = X(2.2); px <= cw - 20; px += 2) {
      const x = iX(px); const y = 2 + 2 / (x - 2);
      px === X(2.2) ? ctx.moveTo(px, Y(y)) : ctx.lineTo(px, Y(y));
    }
    ctx.stroke(); ctx.restore();

    const xP = 4 - Math.sqrt(2), yP = 4 + Math.sqrt(2);
    const xQ = 4 + Math.sqrt(2), yQ = 4 - Math.sqrt(2);
    drawHandle(xP, yP, 7, "P");
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.arc(X(xQ), Y(yQ), 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("Q", X(xQ) + 8, Y(yQ) - 6);

    drawPill("x + y = 8", X(7), Y(1.5), "#f43f5e");
    drawPill("xy − 2x − 2y = −2", X(7), Y(3), "#38bdf8");
    drawPill("대칭축 y = x", X(7), Y(7), "#facc15");
  } else if (currentQid === "0669") {
    ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(250, 204, 21, 0.4)";
    ctx.beginPath(); ctx.moveTo(X(-3), Y(-3)); ctx.lineTo(X(4), Y(4)); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = X(0.3); px <= cw - 20; px += 2) {
      const x = iX(px); const y = 2 / x;
      px === X(0.3) ? ctx.moveTo(px, Y(y)) : ctx.lineTo(px, Y(y));
    }
    ctx.stroke(); ctx.restore();

    const al = K.alpha || 2.732; const be = 2 / al;

    ctx.save();
    ctx.fillStyle = "rgba(167, 139, 250, 0.25)";
    ctx.strokeStyle = "#a78bfa";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(X(-2), Y(2)); ctx.lineTo(X(al), Y(be)); ctx.lineTo(X(be), Y(al)); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();

    ctx.fillStyle = "#f43f5e";
    ctx.beginPath(); ctx.arc(X(-2), Y(2), 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("A(−2, 2)", X(-2) - 48, Y(2) - 8);

    drawHandle(al, be, 7, "B(α, β)");
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.arc(X(be), Y(al), 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillText("C(β, α)", X(be) - 42, Y(al) - 6);

    const triArea = 0.5 * (al * al - be * be);
    drawPill("y = 2/x", X(4), Y(0.8), "#38bdf8");
    drawPill("y = x 대칭", X(3.8), Y(3.8), "#facc15");
    drawPill(`△ABC 넓이 = ${triArea.toFixed(2)}`, X(0.5), Y(1.8), "#a78bfa");
  } else {
    // 일반 문항 대표 그래프 렌더링
    ctx.save();
    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (currentPage >= 165) {
      for (let px = X(0.3); px <= cw - 20; px += 2) {
        const x = iX(px); const y = 3 / x;
        px === X(0.3) ? ctx.moveTo(px, Y(y)) : ctx.lineTo(px, Y(y));
      }
    } else {
      for (let px = 40; px <= cw - 20; px += 2) {
        const x = iX(px); const y = 0.3 * (x + 1) * (x - 2);
        px === 40 ? ctx.moveTo(px, Y(y)) : ctx.lineTo(px, Y(y));
      }
    }
    ctx.stroke();

    drawHandle(2, 1, 7, "점 P");
    drawPill(`고쟁이 ${currentPage}쪽 [${currentQid}번]`, X(2.5), Y(2.5), "#38bdf8");
    ctx.restore();
  }

  requestAnimationFrame(draw);
}

/* 드래그 이벤트 */
function getCanvasPos(e) {
  const rect = cv.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: cx - rect.left, y: cy - rect.top };
}

function initCanvasEvents() {
  cv = $("#cv");
  ctx = cv.getContext("2d");

  cv.addEventListener("mousedown", () => drag = true);
  cv.addEventListener("touchstart", (e) => {
    drag = true;
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener("mouseup", () => drag = false);
  window.addEventListener("touchend", () => drag = false);
  window.addEventListener("touchcancel", () => drag = false);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("touchmove", onMove, { passive: false });
}

function onMove(e) {
  if (!drag) return;
  if (e.cancelable) e.preventDefault();
  const p = getCanvasPos(e);
  const mx = iX(p.x), my = iY(p.y);

  if (currentQid === "0666") {
    const dx = mx - 1, dy = my - (-6);
    if (Math.abs(dx) > 0.1) {
      K.k = clamp(dy / dx, -8, 5);
      renderProblemCard();
    }
  } else if (currentQid === "0667") {
    K.a = clamp(mx, 0.5, 2.0);
    renderProblemCard();
  } else if (currentQid === "0669") {
    K.alpha = clamp(mx, 1.45, 3.8);
    renderProblemCard();
  }
}

// 초기화
window.addEventListener("DOMContentLoaded", () => {
  initCanvasEvents();
  selectPage(178);
  draw();
  setTimeout(renderMath, 150);
});

if (document.readyState === "complete" || document.readyState === "interactive") {
  initCanvasEvents();
  selectPage(178);
  draw();
  setTimeout(renderMath, 150);
}
